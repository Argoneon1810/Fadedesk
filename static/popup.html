<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sound Manager</title>
  <link rel="stylesheet" href="popup.css" />
  <link rel="stylesheet" href="popup-strips.css" />
  <link rel="stylesheet" href="popup-fx.css" />
  <link rel="stylesheet" href="popup-help.css" />
</head>
<body>
  <div id="console-root" data-dark="true">
    <!-- 상단 컨트롤 데크 -->
    <header class="top-deck">
      <div class="deck-left">
        <button
          id="theme-dot-btn"
          type="button"
          aria-haspopup="dialog"
          aria-expanded="false"
          title="컬러 테마 및 화면 모드 설정"
          class="console-btn dot-trigger"
        >
          <span id="brand-dot" class="brand-dot"></span>
        </button>
        <span class="brand-title">SOUND MANAGER</span>
        <button id="help-btn" type="button" aria-haspopup="dialog" aria-expanded="false" title="사용법 및 부품 안내" class="console-btn help-trigger c-raised">?</button>
        <button id="popout-btn" type="button" title="독립 창으로 분리해 원하는 크기로 조절" aria-label="독립 창으로 콘솔 분리" class="console-btn popout-trigger c-raised"></button>
        <div id="status-pill" class="status-pill c-recessed">
          <span id="status-dot" class="status-dot"></span>
          <span id="status-text" class="status-text truncate">탐색 중...</span>
        </div>
      </div>

      <div class="deck-right">
        <div
          id="alpha-box"
          class="alpha-box c-recessed"
          title="Focus 스무딩(α): 드래그·휠 조절 · 더블클릭 시 0.70(-12dB) 복귀"
        >
          <span id="alpha-label" class="alpha-label">Focus <i class="alpha-sym">α</i></span>
          <div id="alpha-track" class="alpha-track">
            <div class="alpha-slot c-surface">
              <div id="alpha-fill" class="alpha-fill"></div>
            </div>
            <div id="alpha-thumb" class="alpha-thumb c-raised"></div>
          </div>
          <span id="alpha-readout" class="alpha-readout tabular">0.70 · -12dB</span>
        </div>
        <button
          id="reset-modes-btn"
          type="button"
          title="켜져 있는 Solo / Focus 모드를 모두 해제합니다"
          class="console-btn reset-modes-btn c-raised"
          disabled
        >S·F 해제</button>
        <div id="norm-split-group" class="norm-split-group">
          <button
            id="auto-norm-btn"
            type="button"
            title="전역 자동 노멀라이저(균일 N): '전역 따름' 채널에만 적용하며 고급 개별 설정을 덮어쓰지 않습니다"
            class="console-btn top-toggle-btn norm-main-btn c-raised"
          >균일 N</button>
          <button
            id="auto-norm-preset-btn"
            type="button"
            title="자동 노멀라이저 프리셋 선택 (음악 · 표준 · 야간)"
            aria-label="자동 노멀라이저 프리셋 선택"
            aria-haspopup="dialog"
            aria-expanded="false"
            class="console-btn norm-preset-trigger c-raised"
          >▾</button>
        </div>
        <button
          id="adv-rack-btn"
          type="button"
          title="선택 채널 고급 FX 사이드 랙 열기/닫기"
          class="console-btn top-toggle-btn c-raised"
        >고급 FX ▸</button>
      </div>
    </header>

    <!-- 좌측 상단 플로팅 미니 테마 팝오버 (368px 고정폭으로 4종 한글 테마명 전체 노출 보장) -->
    <div id="theme-popover" role="dialog" aria-label="컬러 테마 및 화면 모드" class="theme-popover c-surface hidden">
      <div class="pop-header">
        <span class="c-muted pop-label">컬러 테마</span>
        <span id="pop-cur-summary" class="pop-summary"></span>
      </div>
      <div id="pop-theme-grid" class="pop-theme-grid"></div>
      <div class="pop-mode-section">
        <div class="c-muted pop-label">화면 모드</div>
        <div id="pop-mode-seg" class="pop-mode-seg"></div>
      </div>
    </div>

    <!-- 우측 상단 이지 노멀라이저 3종 프리셋 팝오버 -->
    <div id="norm-popover" role="dialog" aria-label="이지 노멀라이저 프리셋" class="norm-popover c-surface hidden"></div>

    <div id="help-backdrop" class="help-backdrop hidden"></div>
    <div id="tour-overlay" class="tour-overlay hidden"></div>
    <main class="console-bay">
      <div id="channels-scroll" class="channels-scroll"></div>
      <div id="master-dock" class="master-dock"></div>
      <aside id="side-fx-rack" class="side-fx-rack c-surface hidden" aria-label="선택 채널 고급 FX"></aside>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
